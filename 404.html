<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Центр цифрового развития НБ РК</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
:root{--green:#166f43;--ink:#1d1d1f;--ink-2:#3a3a3c;--paper:#fbfbfd;--line:#e5e5ea}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background-image:radial-gradient(40% 45% at 25% 25%,rgba(63,160,107,.12),transparent 70%),radial-gradient(38% 42% at 78% 70%,rgba(154,116,3,.08),transparent 70%)}
.card{max-width:480px}
img{width:72px;height:72px;border-radius:18px;margin-bottom:24px}
b.code{display:block;font-size:64px;font-weight:700;letter-spacing:-.03em;color:var(--green);line-height:1}
h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:14px 0 10px}
p{font-size:15.5px;color:var(--ink-2);line-height:1.55;margin-bottom:26px}
a.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-size:15px;font-weight:500;
  padding:12px 26px;border-radius:12px}
a.link{display:inline-block;margin-left:14px;color:var(--green);text-decoration:none;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <img src="img/favicon.png" alt="ЦЦР">
  <b class="code">404</b>
  <h1>Страница не найдена</h1>
  <p>Возможно, страница была перемещена или адрес введён с ошибкой. Вернитесь на главную или свяжитесь с нами.</p>
  <a class="btn" href="/">На главную</a><a class="link" href="/media.html#contacts">Контакты ›</a>
</div>
</body>
</html>
